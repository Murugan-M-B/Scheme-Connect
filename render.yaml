services:
  # ── Backend: Spring Boot (Java) ────────────────────────────────────────────
  - type: web
    name: scheme-connect-backend
    runtime: java
    rootDir: backend
    buildCommand: ./mvnw clean package -DskipTests
    startCommand: java -jar target/backend-0.0.1-SNAPSHOT.jar
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_URL
        sync: false   # Set this manually in Render dashboard
      - key: DB_USERNAME
        sync: false   # Set this manually in Render dashboard
      - key: DB_PASSWORD
        sync: false   # Set this manually in Render dashboard
      - key: MAIL_USERNAME
        value: schemeconnect26@gmail.com
      - key: MAIL_PASSWORD
        sync: false   # Set this manually in Render dashboard (Gmail app password)
      - key: PORT
        value: 8080
